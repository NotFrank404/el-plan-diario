  <path d="M214 232l10 188h24l-6-188zm60 0l-6 188h24l10-188z" fill="#fff8f0" fill-opacity="0.88" />
  <!-- Palomitas esponjosas -->
  <circle cx="198" cy="204" r="38" fill="#fff6d6" stroke="#f2cf7e" stroke-width="8" />
  <circle cx="256" cy="182" r="44" fill="#fffdf5" stroke="#f2cf7e" stroke-width="8" />
  <circle cx="314" cy="204" r="38" fill="#fff6d6" stroke="#f2cf7e" stroke-width="8" />
  <circle cx="228" cy="218" r="32" fill="#fffdf5" stroke="#f2cf7e" stroke-width="8" />
  <circle cx="286" cy="218" r="32" fill="#fff6d6" stroke="#f2cf7e" stroke-width="8" />
  <!-- Corazón cálido en el centro (Puente Emocional) -->
  <path d="M256 352c-3-2-42-28-42-56 0-15 12-26 26-26 9 0 14 5 16 10 2-5 7-10 16-10 14 0 26 11 26 26 0 28-39 54-42 56z" fill="#fff8f0" />
