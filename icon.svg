<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Icono de El Plan Diario">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8f0" />
      <stop offset="55%" stop-color="#ffe2cc" />
      <stop offset="100%" stop-color="#ffd1b3" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f08362" />
      <stop offset="100%" stop-color="#e76f51" />
    </linearGradient>
  </defs>
  <!-- Fondo redondeado cálido -->
  <rect width="512" height="512" rx="116" fill="url(#bg)" />
  <!-- Halo suave decorativo -->
  <circle cx="256" cy="248" r="168" fill="#ffffff" fill-opacity="0.65" />
  <!-- Cubo de palomitas acogedor -->
  <path d="M168 232h176l-24 164a28 28 0 0 1-28 24h-72a28 28 0 0 1-28-24z" fill="url(#accent)" />
