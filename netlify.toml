[build]
  publish = "."

[functions]
  directory = "netlify/functions"

# Evitamos que archivos internos o el código de la función se sirvan como estáticos
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/*.bat"
  to = "/404.html"
  status = 404
  force = true
